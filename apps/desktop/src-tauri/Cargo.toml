[package]
name = "call-analyst-desktop"
version = "1.0.0"
description = "Call Analyst Desktop - 2-Channel Loopback Audio Recorder for Zoom/Telegram Calls"
authors = ["Call Analyst Team"]
edition = "2021"

[lib]
name = "call_analyst_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cpal = "0.15"
hound = "3.5"
tokio = { version = "1", features = ["full"] }
